server:
  port: 8080

spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      # The AngularJS pages are the same files the Node app serves; Java serves them so their
      # relative /api/... calls land on this backend instead of the other one.
      cache:
        cachecontrol:
          no-store: true
      static-locations: file:../static/, file:uploads/, classpath:/static/

  datasource:
    # Java cannot open the Node PGlite database; it needs a real PostgreSQL server.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/equidron}
    username: ${DATABASE_USER:equidron}
    password: ${DATABASE_PASSWORD:equidron}
  flyway:
    enabled: true
    # The migrations the Node app already uses, so both read the same schema of record.
    locations: filesystem:../netlify/database/migrations
    baseline-on-migrate: true
    # The migrations are named 20261017000000_initial_schema.sql (no V prefix, one underscore), which
    # is what the Node/Netlify tooling expects; Flyway is told to read the same convention rather
    # than renaming files that have already been applied elsewhere.
    sql-migration-prefix: ""
    sql-migration-separator: "_"
    out-of-order: true

# The seller sign-in page lists these accounts; a demo convenience, off where the site is real.
equidron:
  showAccounts: true

server:
  port: 8080

spring:
  datasource:
    # Java cannot open the Node PGlite database; it needs a real PostgreSQL server.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/equidron}
    username: ${DATABASE_USER:equidron}
    password: ${DATABASE_PASSWORD:equidron}
  flyway:
    enabled: true
    # The migrations the Node app already uses, so both read the same schema of record.
    locations: filesystem:../netlify/database/migrations
    baseline-on-migrate: true
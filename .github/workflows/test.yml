# Runs every test on each push and pull request. Most tests use PGlite and a scripted
# stand-in for Claude, so they need no secrets or network. The concurrency tests also run
# against a real PostgreSQL server (the service below), because PGlite runs one transaction
# at a time and can't show what happens when requests overlap.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equidron
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway database inside this CI run, so no password at all
          POSTGRES_DB: equidron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equidron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test
      - name: Concurrency tests on real PostgreSQL
        run: node --test tests/concurrency.test.js
        env:
          TEST_DATABASE_URL: postgres://equidron@localhost:5432/equidron_test

# Builds the Java marketplace and runs its tests on every push and pull request.
#
# The Node server is gone from this repository: the marketplace runs on the JVM and PostgreSQL, and the
# migrations travel inside the jar. This workflow proves the jar builds and that the unit and database tests
# pass against a throwaway PostgreSQL, so a broken build is caught before anybody clicks anything.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: equidron
          POSTGRES_PASSWORD: equidron-local
          POSTGRES_DB: equidron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equidron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, unit tests and database tests
        working-directory: java-backend
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/equidron_test
          DATABASE_USER: equidron
          DATABASE_PASSWORD: equidron-local
        run: mvn -B verify

      - name: The jar carries its own schema
        working-directory: java-backend
        run: |
          count=$(unzip -l target/equidron-api-0.1.0.jar | grep -c 'db/migration/.*\.sql' || true)
          echo "migrations in the jar: $count"
          test "$count" -ge 30

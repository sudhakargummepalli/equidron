# Static front ends from static/, API + images from netlify/functions/api.mjs.
[build]
  publish = "static"
  command = "echo 'No build step: plain HTML/JS front end, Node API function.'"

[build.environment]
  # Functions run on the build's Node version.
  # The database is Netlify Database (migrations in netlify/database/migrations/).
  # Set DATABASE_URL under Site configuration -> Environment variables to use another PostgreSQL server.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # pg-native is an optional add-on of the pg driver; PGlite is only used for local runs and tests.
  external_node_modules = ["pg-native", "@electric-sql/pglite"]

# Security headers on every page. The same list is in src/security-headers.js (the local
# server); tests/security.test.js checks they match. Microphone stays allowed for voice chat.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), microphone=(self)"

[[redirects]]
  from = "/"
  to = "/shop/"
  status = 302
